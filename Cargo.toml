[package]
name = "mumbleping-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Patrick Kilter <patrick.kilter@gmail.com>"]
description = "Library to ping a mumbleserver and get some basic informations about its status"
readme = "README.md"
repository = "https://github.com/m0veax/mumbleping-rs"

[dependencies]
bincode = "2.0.1"
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "2.0.21"
